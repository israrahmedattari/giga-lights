<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <!-- Cyan Glow Filter -->
    <filter id="neonGlowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gold Glow Filter -->
    <filter id="neonGlowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradient Fill for Bulb -->
    <linearGradient id="bulbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0080ff" />
    </linearGradient>

    <!-- Gradient Fill for Bolt -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>
  </defs>

  <!-- Dark Background Canvas -->
  <rect width="500" height="120" rx="16" fill="#080B10" />

  <!-- LOGO ICON -->
  <g transform="translate(20, 10)">
    <!-- Outer Bulb Outline -->
    <path d="M 50 15 A 35 35 0 0 1 85 50 C 85 62 76 72 72 82 L 28 82 C 24 72 15 62 15 50 A 35 35 0 0 1 50 15 Z" 
          fill="none" stroke="url(#bulbGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#neonGlowCyan)" />

    <!-- Bulb Screw Base -->
    <path d="M 32 87 L 68 87 M 36 93 L 64 93" 
          fill="none" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 42 98 L 58 98" 
          fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />

    <!-- Inner "G" + Lightning Bolt Filament -->
    <path d="M 60 40 A 14 14 0 1 0 60 62 L 50 62 L 56 48 L 44 54 L 50 40" 
          fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlowGold)" />
  </g>

  <!-- TYPOGRAPHY -->
  <g transform="translate(130, 0)">
    <!-- "GIGA" Text -->
    <text x="0" y="68" 
          font-family="'Plus Jakarta Sans', 'Montserrat', sans-serif" 
          font-size="46" 
          font-weight="800" 
          fill="#ffffff" 
          letter-spacing="2">GIGA</text>

    <!-- "LIGHTS" Text -->
    <text x="142" y="68" 
          font-family="'Plus Jakarta Sans', 'Montserrat', sans-serif" 
          font-size="46" 
          font-weight="800" 
          fill="#00f2fe" 
          letter-spacing="2" filter="url(#neonGlowCyan)">LIGHTS</text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="94" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-size="12" 
          font-weight="600" 
          fill="#ffb703" 
          letter-spacing="6">NEXT-GEN LED SOLUTIONS</text>
  </g>
</svg>
